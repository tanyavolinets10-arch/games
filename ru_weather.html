<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Изучаем русский язык: Погода и температура</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/canvas-confetti.browser.min.js"></script>
    <style>
        body {
            background-image: linear-gradient(rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 0.8)), url('https://i.postimg.cc/0NMN68Ss/pogoda.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 select-none font-sans text-slate-800">

    <!-- Шапка с прогрессом -->
    <div id="header-container" class="bg-white/90 backdrop-blur px-6 py-3 rounded-2xl shadow-md border-2 border-sky-200 flex justify-between items-center w-full max-w-md hidden">
        <div class="flex items-center gap-2">
            <button onclick="goHome()" class="bg-sky-100 hover:bg-sky-200 text-sky-900 px-3 py-1 rounded-xl text-xs font-bold cursor-pointer">🏠 Меню</button>
            <h1 class="text-sm font-bold text-sky-800" id="round-title">Игра</h1>
        </div>
        <div class="font-bold text-slate-700 text-xs">⭐ Очки: <span id="stars" class="text-sky-600">0</span> | Осталось: <span id="progress-text">0</span></div>
    </div>

    <!-- Основное игровое поле -->
    <div class="w-full max-w-md flex flex-col gap-4 my-auto">
        
        <!-- ГЛАВНОЕ МЕНЮ -->
        <div id="round-menu" class="bg-white/95 backdrop-blur border-4 border-sky-300 rounded-3xl p-6 shadow-xl flex flex-col items-center gap-4 text-center">
            <div class="text-3xl">🌤️🥶🤸🧊</div>
            <h2 class="text-xl font-black text-sky-900">Погода и температура</h2>
            <p class="text-xs text-slate-600">Выберите раздел для изучения:</p>
            
            <div class="flex flex-col gap-2.5 w-full">
                <!-- БЛОК 1: ПОГОДА -->
                <div class="bg-sky-50 border-2 border-sky-200 rounded-2xl p-3 flex flex-col gap-2">
                    <span class="text-xs font-black text-sky-900 uppercase">🌦️ Часть 1: Погода</span>
                    <button onclick="startCategory('weather', 1)" class="bg-white hover:bg-sky-100 border border-sky-300 text-sky-900 font-bold py-2 px-4 rounded-xl text-xs cursor-pointer transition shadow-xs">
                        👂 Раунд 1: Слышим слово ➔ Значок
                    </button>
                    <button onclick="startCategory('weather', 2)" class="bg-white hover:bg-sky-100 border border-sky-300 text-sky-900 font-bold py-2 px-4 rounded-xl text-xs cursor-pointer transition shadow-xs">
                        🗣️ Раунд 2: Видим картинку ➔ Слушаем звук
                    </button>
                </div>

                <!-- БЛОК 2: ОЩУЩЕНИЯ -->
                <div class="bg-amber-50 border-2 border-amber-200 rounded-2xl p-3 flex flex-col gap-2">
                    <span class="text-xs font-black text-amber-900 uppercase">🌡️ Часть 2: Ощущения и состояние</span>
                    <button onclick="startCategory('feelings', 1)" class="bg-white hover:bg-amber-100 border border-amber-300 text-amber-900 font-bold py-2 px-4 rounded-xl text-xs cursor-pointer transition shadow-xs">
                        👂 Раунд 1: Слышим слово ➔ Значок
                    </button>
                    <button onclick="startCategory('feelings', 2)" class="bg-white hover:bg-amber-100 border border-amber-300 text-amber-900 font-bold py-2 px-4 rounded-xl text-xs cursor-pointer transition shadow-xs">
                        🗣️ Раунд 2: Видим картинку ➔ Слушаем звук
                    </button>
                </div>

                <!-- БЛОК 3: ФИНАЛЬНЫЙ МИКС -->
                <button onclick="startCategory('mix', 'all')" class="bg-gradient-to-r from-sky-500 to-indigo-500 hover:from-sky-600 hover:to-indigo-600 text-white font-black py-3 px-4 rounded-2xl shadow cursor-pointer text-sm transition flex items-center justify-center gap-2">
                    🏆 Часть 3: Большой Финальный Микс (Вразброс!)
                </button>
            </div>
        </div>

        <!-- ИГРОВОЙ ЭКРАН -->
        <div id="game-container" class="bg-white/95 backdrop-blur border-4 border-sky-300 rounded-3xl p-6 shadow-xl flex flex-col items-center gap-5 text-center hidden">
            <div id="task-box" class="w-full bg-sky-50 border-2 border-sky-200 rounded-2xl p-5 flex flex-col items-center gap-3">
                <!-- Динамическое задание -->
            </div>
            <div class="w-full" id="options-grid">
                <!-- Варианты ответов -->
            </div>
        </div>

    </div>

    <!-- Экран победы -->
    <div id="win" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl p-8 max-w-sm text-center shadow-2xl border-4 border-sky-400 flex flex-col items-center gap-4">
            <div class="text-7xl animate-bounce">🏆</div>
            <h2 class="text-2xl font-bold text-sky-700">Великолепно!</h2>
            <p class="text-slate-600 text-sm" id="win-text">Ты успешно справился с заданием!</p>
            <button onclick="goHome()" class="bg-sky-600 hover:bg-sky-700 text-white font-bold py-3 px-6 rounded-xl shadow cursor-pointer text-base w-full">
                В меню 🏠
            </button>
        </div>
    </div>

    <script>
        const weatherGroup = [
            { name: "солнечно", icon: "☀️" },
            { name: "облачно", icon: "☁️" },
            { name: "дождь", icon: "🌧️" },
            { name: "снег", icon: "❄️" },
            { name: "град", icon: "⛈️🧊" }, // Туча с градом
            { name: "гроза", icon: "⛈️" },
            { name: "ветренно", icon: "💨" },
            { name: "туман", icon: "🌫️" },
            { name: "гололёд", icon: "🧊⛸️" } // Лёд и коньки
        ];

        const feelingsGroup = [
            { name: "тепло", icon: "😊" },
            { name: "холодно", icon: "🥶" },
            { name: "жарко", icon: "🥵" },
            { name: "мокро", icon: "💧" },
            { name: "скользко", icon: "🤸🧊" } // Человечек подскользнулся на льду
        ];

        const allData = [...weatherGroup, ...feelingsGroup];

        let activeDataset = [];
        let currentMode = 1; 
        let roundQueue = [];
        let currentTarget = null;
        let stars = 0;
        let isBlocked = false;

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ru-RU';
                utterance.rate = 0.85;
                window.speechSynthesis.speak(utterance);
            }
        }

        function shuffle(array) {
            return [...array].sort(() => Math.random() - 0.5);
        }

        function goHome() {
            window.speechSynthesis.cancel();
            document.getElementById('header-container').classList.add('hidden');
            document.getElementById('game-container').classList.add('hidden');
            document.getElementById('win').classList.add('hidden');
            document.getElementById('round-menu').classList.remove('hidden');
        }

        function startCategory(category, mode) {
            currentMode = mode;
            stars = 0;
            document.getElementById('round-menu').classList.add('hidden');
            document.getElementById('header-container').classList.remove('hidden');
            document.getElementById('game-container').classList.remove('hidden');
            
            if (category === 'weather') {
                activeDataset = [...weatherGroup];
            } else if (category === 'feelings') {
                activeDataset = [...feelingsGroup];
            } else {
                activeDataset = [...allData];
            }

            roundQueue = shuffle([...activeDataset]);
            
            speak("Послушай и выбери");
            loadNextTask();
        }

        function loadNextTask() {
            if (roundQueue.length === 0) {
                document.getElementById('game-container').classList.add('hidden');
                document.getElementById('header-container').classList.add('hidden');
                document.getElementById('win').classList.remove('hidden');
                if (typeof confetti === 'function') confetti({ particleCount: 150, spread: 100, origin: { y: 0.5 } });
                speak("Ура! Ты отлично справился со всеми заданиями!");
                return;
            }

            isBlocked = false;
            currentTarget = roundQueue[0];

            let titleName = currentMode === 'mix' ? "Финальный Микс" : (currentMode === 1 ? "Раунд 1 (Слушаем)" : "Раунд 2 (Говорим)");
            document.getElementById('round-title').innerText = `🌤️ ${titleName}`;
            document.getElementById('progress-text').innerText = roundQueue.length;
            document.getElementById('stars').innerText = stars;

            let effectiveMode = currentMode;
            if (currentMode === 'mix') {
                effectiveMode = Math.random() < 0.5 ? 1 : 2;
            }

            if (effectiveMode === 1) {
                renderRound1();
            } else {
                renderRound2();
            }
        }

        // --- РАУНД 1: Слышим слово ➔ Выбираем значок ---
        function renderRound1() {
            const taskBox = document.getElementById('task-box');
            taskBox.innerHTML = `
                <div class="text-xs font-bold text-sky-800 uppercase tracking-wide">Найди значок для слова:</div>
                <button onclick="speak(currentTarget.name)" class="bg-sky-600 hover:bg-sky-700 text-white font-bold px-6 py-3 rounded-2xl text-base shadow cursor-pointer transition flex items-center gap-2">
                    🔊 Послушать слово
                </button>
            `;
            speak(currentTarget.name);

            const grid = document.getElementById('options-grid');
            grid.className = "grid grid-cols-2 gap-3";
            grid.innerHTML = "";

            let options = [currentTarget];
            let others = activeDataset.filter(item => item.name !== currentTarget.name);
            options = options.concat(shuffle(others).slice(0, 3));
            options = shuffle(options);

            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "h-28 bg-sky-50 hover:bg-sky-100 border-2 border-sky-200 rounded-2xl flex items-center justify-center cursor-pointer transition shadow-sm relative overflow-hidden";
                btn.dataset.season = opt.name;
                btn.innerHTML = `
                    <span class="text-5xl">${opt.icon}</span>
                    <div class="status-overlay absolute inset-0 hidden items-center justify-center text-4xl bg-black/10"></div>
                `;
                btn.onclick = () => checkAnswerRound1(btn, opt.name === currentTarget.name);
                grid.appendChild(btn);
            });
        }

        function checkAnswerRound1(btnElement, isCorrect) {
            if (isBlocked) return;
            isBlocked = true;

            const overlay = btnElement.querySelector('.status-overlay');
            overlay.classList.remove('hidden');

            if (isCorrect) {
                stars += 1;
                document.getElementById('stars').innerText = stars;
                overlay.innerText = "✅";
                speak("Правильно!");
                if (typeof confetti === 'function') confetti({ particleCount: 25, spread: 30, origin: { y: 0.7 } });
                roundQueue.shift();
            } else {
                overlay.innerText = "❌";
                speak("Попробуй ещё раз!");

                document.querySelectorAll('#options-grid button').forEach(b => {
                    if (b.dataset.season === currentTarget.name) {
                        b.querySelector('.status-overlay').innerText = "✅";
                        b.querySelector('.status-overlay').classList.remove('hidden');
                    }
                });

                const failed = roundQueue.shift();
                roundQueue.push(failed);
            }

            setTimeout(() => {
                loadNextTask();
            }, 1400);
        }

        // --- РАУНД 2: Видим картинку ➔ Выбираем звук на слух ---
        function renderRound2() {
            const taskBox = document.getElementById('task-box');
            taskBox.innerHTML = `
                <div class="text-xs font-bold text-sky-800 uppercase tracking-wide">Посмотри на картинку и выбери звук на слух:</div>
                <div class="text-6xl my-2">${currentTarget.icon}</div>
            `;

            const grid = document.getElementById('options-grid');
            grid.className = "flex flex-col gap-2.5 w-full";
            grid.innerHTML = "";

            let options = [currentTarget];
            let others = activeDataset.filter(item => item.name !== currentTarget.name);
            options = options.concat(shuffle(others).slice(0, 3));
            options = shuffle(options);

            options.forEach((opt, index) => {
                const row = document.createElement('div');
                row.className = "flex items-center justify-between bg-sky-50/60 border border-sky-200 rounded-2xl p-3 shadow-xs";
                
                row.innerHTML = `
                    <div class="flex items-center gap-2">
                        <span class="w-7 h-7 rounded-full bg-sky-200 text-sky-900 font-bold text-xs flex items-center justify-center">${index + 1}</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="speak('${opt.name}')" class="bg-sky-100 hover:bg-sky-200 text-sky-900 px-4 py-2 rounded-xl text-xs cursor-pointer transition font-bold shadow-xs flex items-center gap-1">
                            🔊 Слушать
                        </button>
                        <button onclick="checkAnswerRound2(${opt.name === currentTarget.name}, this, '${opt.name}')" class="bg-sky-600 hover:bg-sky-700 text-white font-bold text-xs px-5 py-2 rounded-xl cursor-pointer transition shadow">
                            Выбрать ✨
                        </button>
                    </div>
                `;
                grid.appendChild(row);
            });
        }

        function checkAnswerRound2(isCorrect, btnElement, optName) {
            if (isBlocked) return;
            isBlocked = true;

            const rowElement = btnElement.closest('div.bg-sky-50\\/60');

            if (isCorrect) {
                stars += 1;
                document.getElementById('stars').innerText = stars;
                rowElement.className = "flex items-center justify-between bg-emerald-100 border border-emerald-500 rounded-2xl p-3 shadow-xs relative";
                btnElement.className = "bg-emerald-600 text-white font-bold text-xs px-5 py-2 rounded-xl";
                btnElement.innerText = "Верно! ✔️";
                speak(`Правильно! Это ${optName}`);
                if (typeof confetti === 'function') confetti({ particleCount: 25, spread: 30, origin: { y: 0.7 } });
                roundQueue.shift();
            } else {
                rowElement.className = "flex items-center justify-between bg-rose-100 border border-rose-400 rounded-2xl p-3 shadow-xs relative";
                btnElement.className = "bg-rose-500 text-white font-bold text-xs px-5 py-2 rounded-xl";
                btnElement.innerText = "Ошибка ❌";
                speak("Неправильно, попробуй другой вариант");

                const failed = roundQueue.shift();
                roundQueue.push(failed);
            }

            setTimeout(() => {
                loadNextTask();
            }, 1400);
        }
    </script>
</body>
</html>
