<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шкільне приладдя: Англійська мова</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/canvas-confetti.browser.min.js"></script>
    <style>
        body {
            background-color: #f8fafc;
            background-image: linear-gradient(rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.9)), url('https://i.postimg.cc/vBTfqpkv/skol\'nie-prinadleznosti.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 select-none font-sans text-slate-800">

    <!-- Шапка з прогресом -->
    <div id="header-container" class="bg-white shadow-md border-2 border-indigo-200 px-6 py-3 rounded-2xl flex justify-between items-center w-full max-w-md hidden">
        <div class="flex items-center gap-2">
            <button id="home-btn" class="bg-indigo-100 hover:bg-indigo-200 text-indigo-900 px-3 py-1 rounded-xl text-xs font-bold cursor-pointer">🏠 Меню</button>
            <h1 class="text-sm font-bold text-indigo-800" id="round-title">Раунд</h1>
        </div>
        <div class="font-bold text-slate-700 text-xs">⭐ Бали: <span id="stars" class="text-indigo-600">0</span> | Залишилось: <span id="progress-text">14</span></div>
    </div>

    <!-- Основне ігрове поле -->
    <div class="w-full max-w-md flex flex-col gap-4 my-auto">
        
        <!-- ГОЛОВНЕ МЕНЮ -->
        <div id="round-menu" class="bg-white border-4 border-indigo-300 rounded-3xl p-6 shadow-xl flex flex-col items-center gap-5 text-center">
            <div class="text-3xl">🎒✏️📚📐</div>
            <h2 class="text-xl font-black text-indigo-900">Шкільне приладдя</h2>
            <p class="text-xs text-slate-600">Оберіть потрібний раунд для вивчення:</p>
            
            <div class="flex flex-col gap-3 w-full">
                <button id="btn-round-1" class="bg-indigo-50 hover:bg-indigo-100 border-2 border-indigo-300 text-indigo-900 font-bold p-4 rounded-2xl shadow-sm cursor-pointer transition flex flex-col items-center gap-1">
                    <span class="text-sm font-black">🖼️ Раунд 1: Бачимо картинку ➔ Обираємо слово</span>
                    <span class="text-xs text-slate-600 font-normal">Дивимося на малюнок і обираємо англійський звук</span>
                </button>

                <button id="btn-round-2" class="bg-indigo-50 hover:bg-indigo-100 border-2 border-indigo-300 text-indigo-900 font-bold p-4 rounded-2xl shadow-sm cursor-pointer transition flex flex-col items-center gap-1">
                    <span class="text-sm font-black">👂 Раунд 2: Чуємо слово ➔ Шукаємо картинку</span>
                    <span class="text-xs text-slate-600 font-normal">Слухаємо англійське слово і обираємо ілюстрацію</span>
                </button>
            </div>
        </div>

        <!-- ІГРОВИЙ ЕКРАН -->
        <div id="game-container" class="bg-white border-4 border-indigo-300 rounded-3xl p-6 shadow-xl flex flex-col items-center gap-5 text-center hidden">
            <div id="task-box" class="w-full bg-indigo-50 border-2 border-indigo-200 rounded-2xl p-5 flex flex-col items-center gap-3">
                <!-- Динамічне завдання -->
            </div>
            <div class="w-full" id="options-grid">
                <!-- Варіанти відповідей -->
            </div>
        </div>

    </div>

    <!-- Екран перемоги -->
    <div id="win" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl p-8 max-w-sm text-center shadow-2xl border-4 border-indigo-400 flex flex-col items-center gap-4">
            <div class="text-7xl animate-bounce">🏆</div>
            <h2 class="text-2xl font-bold text-indigo-700">Чудово!</h2>
            <p class="text-slate-600 text-sm">Ти успішно пройшов усі слова за твоїми малюнками!</p>
            <button id="restart-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-xl shadow cursor-pointer text-base w-full">
                До меню 🏠
            </button>
        </div>
    </div>

    <script>
        const schoolItems = [
            { name: "pencil", translation: "олівець", img: "https://i.postimg.cc/5XNLMG0b/Untitled.png" },
            { name: "blackboard", translation: "дошка", img: "https://i.postimg.cc/218hfJ6C/doska.png" },
            { name: "map", translation: "карта", img: "https://i.postimg.cc/WdbgPK32/karta.png" },
            { name: "book", translation: "книга", img: "https://i.postimg.cc/185wZTtm/kniga.png" },
            { name: "ruler", translation: "лінійка", img: "https://i.postimg.cc/hXyx4rzR/linejka.png" },
            { name: "felt-tip pen", translation: "фломастер (маркер)", img: "https://i.postimg.cc/qNbnBLhT/marker.png" },
            { name: "desk", translation: "парта", img: "https://i.postimg.cc/FYWcFZdm/parta.png" },
            { name: "pencil case", translation: "пенал", img: "https://i.postimg.cc/VJGMsRrw/penal.png" },
            { name: "bag", translation: "портфель", img: "https://i.postimg.cc/MnPRZDMq/portfel'.png" },
            { name: "poster", translation: "постер (плакат)", img: "https://i.postimg.cc/k218Mc67/poster.png" },
            { name: "pen", translation: "ручка", img: "https://i.postimg.cc/5X7v93Yx/rucka.png" },
            { name: "rubber", translation: "стирачка", img: "https://i.postimg.cc/LJCf4TY9/steracka.png" },
            { name: "copybook", translation: "зошит", img: "https://i.postimg.cc/0zWm5fM2/tetrad'.png" },
            { name: "compass", translation: "циркуль", img: "https://i.postimg.cc/mPXMZwzg/cirkul'.png" }
        ];

        let currentRoundNum = 1;
        let roundQueue = [];
        let currentTarget = null;
        let stars = 0;
        let isBlocked = false;

        function speak(text) {
            if ('speechSynthesis' in window) {
                try {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'en-US';
                    utterance.rate = 0.85;
                    window.speechSynthesis.speak(utterance);
                } catch(e) {
                    console.log("Speech error:", e);
                }
            }
        }

        function shuffle(array) {
            return [...array].sort(() => Math.random() - 0.5);
        }

        function goHome() {
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            document.getElementById('header-container').classList.add('hidden');
            document.getElementById('game-container').classList.add('hidden');
            document.getElementById('win').classList.add('hidden');
            document.getElementById('round-menu').classList.remove('hidden');
        }

        function startRound(roundNum) {
            currentRoundNum = roundNum;
            stars = 0;
            document.getElementById('round-menu').classList.add('hidden');
            document.getElementById('header-container').classList.remove('hidden');
            document.getElementById('game-container').classList.remove('hidden');
            
            roundQueue = shuffle([...schoolItems]);
            speak("Let's start");
            loadNextTask();
        }

        function loadNextTask() {
            if (roundQueue.length === 0) {
                document.getElementById('game-container').classList.add('hidden');
                document.getElementById('header-container').classList.add('hidden');
                document.getElementById('win').classList.remove('hidden');
                if (typeof confetti === 'function') confetti({ particleCount: 150, spread: 100, origin: { y: 0.5 } });
                speak("Hooray! You did a great job!");
                return;
            }

            isBlocked = false;
            currentTarget = roundQueue[0];

            document.getElementById('round-title').innerText = `🎒 Раунд ${currentRoundNum}`;
            document.getElementById('progress-text').innerText = roundQueue.length;
            document.getElementById('stars').innerText = stars;

            if (currentRoundNum === 1) {
                renderRound1();
            } else {
                renderRound2();
            }
        }

        // --- РАУНД 1: Видим картинку ➔ Выбираем слово на слух ---
        function renderRound1() {
            const taskBox = document.getElementById('task-box');
            taskBox.innerHTML = `
                <div class="text-xs font-bold text-indigo-800 uppercase tracking-wide">Подивись на малюнок і обери слово на слух:</div>
                <div class="w-32 h-32 bg-white border-2 border-indigo-200 rounded-2xl flex items-center justify-center p-2 shadow-sm my-1 mx-auto overflow-hidden">
                    <img src="${currentTarget.img}" alt="${currentTarget.translation}" class="max-h-full max-w-full object-contain">
                </div>
                <div class="text-xs text-indigo-700 font-bold">(${currentTarget.translation})</div>
            `;

            const grid = document.getElementById('options-grid');
            grid.className = "flex flex-col gap-2.5 w-full";
            grid.innerHTML = "";

            let options = [currentTarget];
            let others = schoolItems.filter(item => item.name !== currentTarget.name);
            options = options.concat(shuffle(others).slice(0, 3));
            options = shuffle(options);

            options.forEach((opt, index) => {
                const row = document.createElement('div');
                row.className = "flex items-center justify-between bg-indigo-50/60 border border-indigo-200 rounded-2xl p-3 shadow-xs";
                
                row.innerHTML = `
                    <div class="flex items-center gap-2">
                        <span class="w-6 h-6 rounded-full bg-indigo-200 text-indigo-900 font-bold text-xs flex items-center justify-center">${index + 1}</span>
                        <span class="text-sm font-bold text-slate-700">${opt.name}</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <button class="speak-btn bg-indigo-100 hover:bg-indigo-200 text-indigo-900 px-3 py-2 rounded-xl text-xs cursor-pointer transition font-bold shadow-xs flex items-center gap-1" data-word="${opt.name}">
                            🔊 Слухати
                        </button>
                        <button class="select-btn bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs px-4 py-2 rounded-xl cursor-pointer transition shadow" data-correct="${opt.name === currentTarget.name}" data-word="${opt.name}">
                            Обрати ✨
                        </button>
                    </div>
                `;
                grid.appendChild(row);
            });

            grid.querySelectorAll('.speak-btn').forEach(btn => {
                btn.addEventListener('click', () => speak(btn.dataset.word));
            });

            grid.querySelectorAll('.select-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    checkAnswerRound1(btn.dataset.correct === 'true', btn, btn.dataset.word);
                });
            });
        }

        function checkAnswerRound1(isCorrect, btnElement, optName) {
            if (isBlocked) return;
            isBlocked = true;

            const rowElement = btnElement.closest('div.bg-indigo-50\\/60');

            if (isCorrect) {
                stars += 1;
                document.getElementById('stars').innerText = stars;
                rowElement.className = "flex items-center justify-between bg-emerald-100 border border-emerald-500 rounded-2xl p-3 shadow-xs relative";
                btnElement.className = "bg-emerald-600 text-white font-bold text-xs px-4 py-2 rounded-xl";
                btnElement.innerText = "Вірно! ✔️";
                speak(`Correct! It is ${optName}`);
                if (typeof confetti === 'function') confetti({ particleCount: 25, spread: 30, origin: { y: 0.7 } });
                roundQueue.shift();
            } else {
                rowElement.className = "flex items-center justify-between bg-rose-100 border border-rose-400 rounded-2xl p-3 shadow-xs relative";
                btnElement.className = "bg-rose-500 text-white font-bold text-xs px-4 py-2 rounded-xl";
                btnElement.innerText = "Помилка ❌";
                speak("Incorrect, try another option");

                const failed = roundQueue.shift();
                roundQueue.push(failed);
            }

            setTimeout(() => {
                loadNextTask();
            }, 1400);
        }

        // --- РАУНД 2: Слышим слово ➔ Ищем картинку ---
        function renderRound2() {
            const taskBox = document.getElementById('task-box');
            taskBox.innerHTML = `
                <div class="text-xs font-bold text-indigo-800 uppercase tracking-wide">Знайди малюнок для слова:</div>
                <button id="listen-target-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-6 py-3 rounded-2xl text-base shadow cursor-pointer transition flex items-center gap-2 mx-auto">
                    🔊 Listen to word
                </button>
            `;
            speak(currentTarget.name);

            document.getElementById('listen-target-btn').addEventListener('click', () => speak(currentTarget.name));

            const grid = document.getElementById('options-grid');
            grid.className = "grid grid-cols-2 gap-3";
            grid.innerHTML = "";

            let options = [currentTarget];
            let others = schoolItems.filter(item => item.name !== currentTarget.name);
            options = options.concat(shuffle(others).slice(0, 3));
            options = shuffle(options);

            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "h-36 bg-indigo-50 hover:bg-indigo-100 border-2 border-indigo-200 rounded-2xl flex flex-col items-center justify-center cursor-pointer transition shadow-sm relative overflow-hidden p-2";
                btn.dataset.item = opt.name;
                btn.innerHTML = `
                    <div class="w-20 h-20 flex items-center justify-center overflow-hidden pointer-events-none">
                        <img src="${opt.img}" alt="${opt.translation}" class="max-h-full max-w-full object-contain">
                    </div>
                    <span class="text-[11px] text-indigo-900 font-semibold mt-1 pointer-events-none">${opt.translation}</span>
                    <div class="status-overlay absolute inset-0 hidden items-center justify-center text-4xl bg-white/90"></div>
                `;
                btn.addEventListener('click', () => checkAnswerRound2(btn, opt.name === currentTarget.name));
                grid.appendChild(btn);
            });
        }

        function checkAnswerRound2(btnElement, isCorrect) {
            if (isBlocked) return;
            isBlocked = true;

            let overlay = btnElement.querySelector('.status-overlay');
            if (!overlay) {
                overlay = document.createElement('div');
                overlay.className = "status-overlay absolute inset-0 flex items-center justify-center text-4xl bg-white/90";
                btnElement.appendChild(overlay);
            }
            overlay.classList.remove('hidden');

            if (isCorrect) {
                stars += 1;
                document.getElementById('stars').innerText = stars;
                overlay.innerText = "✅";
                speak("Correct!");
                if (typeof confetti === 'function') confetti({ particleCount: 25, spread: 30, origin: { y: 0.7 } });
                roundQueue.shift();
            } else {
                overlay.innerText = "❌";
                speak("Try again!");

                document.querySelectorAll('#options-grid button').forEach(b => {
                    if (b.dataset.item === currentTarget.name) {
                        let bOverlay = b.querySelector('.status-overlay');
                        if (!bOverlay) {
                            bOverlay = document.createElement('div');
                            bOverlay.className = "status-overlay absolute inset-0 flex items-center justify-center text-4xl bg-white/90";
                            b.appendChild(bOverlay);
                        }
                        bOverlay.innerText = "✅";
                        bOverlay.classList.remove('hidden');
                    }
                });

                const failed = roundQueue.shift();
                roundQueue.push(failed);
            }

            setTimeout(() => {
                loadNextTask();
            }, 1400);
        }

        // Прямое навешивание обработчиков без ожидания DOMContentLoaded
        document.getElementById('btn-round-1').onclick = () => startRound(1);
        document.getElementById('btn-round-2').onclick = () => startRound(2);
        document.getElementById('home-btn').onclick = goHome;
        document.getElementById('restart-btn').onclick = goHome;
    </script>
</body>
</html>
