<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Еда на кухне — Предлоги (на, в, под, возле, за, над)</title>
    <style>
        body {
            background-color: #0f172a;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #1e293b;
        }
        .hidden { display: none !important; }

        .box {
            background: white;
            border: 4px solid #38bdf8;
            border-radius: 20px;
            padding: 22px;
            width: 100%;
            max-width: 980px;
            box-sizing: border-box;
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.35);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        .menu-card {
            max-width: 500px;
            text-align: center;
        }

        .btn {
            background: #f0f9ff;
            border: 2px solid #bae6fd;
            color: #0369a1;
            font-weight: bold;
            padding: 13px;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            font-size: 15px;
            margin-top: 8px;
            transition: 0.12s;
        }
        .btn:hover { background: #e0f2fe; }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            width: 100%;
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            padding: 10px 14px;
            border-radius: 12px;
            box-sizing: border-box;
            font-weight: bold;
        }

        .prep-filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            width: 100%;
            justify-content: center;
        }

        .prep-pill {
            background: #e0f2fe;
            border: 2px solid #7dd3fc;
            color: #0369a1;
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 999px;
            cursor: pointer;
            font-size: 12px;
        }
        .prep-pill.active {
            background: #0284c7;
            border-color: #0284c7;
            color: white;
        }

        .img-container {
            position: relative;
            width: 100%;
            max-width: 920px;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #cbd5e1;
            background: #e2e8f0;
        }
        .img-container img {
            width: 100%;
            height: auto;
            display: block;
            pointer-events: none;
            user-select: none;
        }

        /* По умолчанию зоны невидимы и не закрывают картинку; подсветка только при наведении */
        .hotspot {
            position: absolute;
            cursor: pointer;
            border: 2px solid transparent;
            background: transparent;
            border-radius: 8px;
            box-sizing: border-box;
            transition: background 0.14s, border-color 0.14s, transform 0.12s;
        }
        .hotspot:hover {
            background: rgba(14, 165, 233, 0.34);
            border-color: rgba(2, 132, 199, 0.92);
            transform: scale(1.01);
        }

        .hotspot-correct {
            border: 3px solid #16a34a !important;
            background: rgba(22, 163, 74, 0.45) !important;
        }

        .hotspot-wrong {
            border: 3px solid #dc2626 !important;
            background: rgba(220, 38, 38, 0.45) !important;
        }

        .ctrl-btn {
            background: white;
            border: 1px solid #cbd5e1;
            padding: 6px 11px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
        }
        .ctrl-btn:hover { background: #e2e8f0; }

        .status-msg {
            font-size: 14px;
            font-weight: bold;
            min-height: 20px;
            color: #0369a1;
            text-align: center;
        }

        .menu-hint {
            font-size: 12px;
            color: #475569;
            margin-top: 6px;
            min-height: 18px;
        }
    </style>
</head>
<body>

    <!-- ГЛАВНОЕ МЕНЮ -->
    <div id="menu-screen" class="box menu-card">
        <div style="font-size: 36px;">🍕🧊🧁🍳</div>
        <h2 style="color: #0369a1; margin: 4px 0;">Еда на кухне — Предлоги</h2>
        <p style="font-size: 13px; color: #64748b; margin: 0;">
            Отработка предлогов <b>на, в, под, возле, за, над</b>
        </p>

        <div class="prep-filter-row" id="menu-prep-filters" style="margin-top: 8px;"></div>
        <div id="menu-filter-info" class="menu-hint"></div>

        <button type="button" id="btn-mode-1" class="btn">🎯 Режим 1: Найди по заданию (предлог + предмет)</button>
        <button type="button" id="btn-mode-2" class="btn">🔊 Режим 2: Свободный клик с озвучкой</button>
    </div>

    <!-- ИГРОВОЙ ЭКРАН -->
    <div id="game-screen" class="box hidden">
        <div class="top-bar">
            <button type="button" id="btn-back-menu" class="ctrl-btn">🏠 Меню</button>
            <div id="game-task-text" style="color: #0369a1; font-size: 15px;">Задание...</div>
            <div style="display: flex; align-items: center; gap: 10px; font-size: 13px;">
                <button type="button" id="repeat-task-btn" class="ctrl-btn">🔊 Озвучить</button>
                <span>⭐ <span id="score">0</span></span>
            </div>
        </div>

        <div id="game-status" class="status-msg"></div>

        <div class="img-container">
            <img id="kitchen-img-game" src="https://i.postimg.cc/9QQsHbBy/eda-na-kuhne.jpg" alt="Еда на кухне">
            <div id="game-hotspots" style="position: absolute; inset: 0;"></div>
        </div>
    </div>

    <script>
        const items = [
            { id: "pizza_table", prep: "на", place: "на столе", name: "пицца на столе", x: 3, y: 59, w: 17, h: 14 },
            { id: "teapot_table", prep: "на", place: "на столе", name: "чайник на столе", x: 12, y: 48, w: 7, h: 12 },
            { id: "cup_table", prep: "на", place: "на столе", name: "чашка на столе", x: 20, y: 54, w: 6, h: 9 },
            { id: "sandwiches_table", prep: "на", place: "на столе", name: "сэндвичи на столе", x: 23, y: 67, w: 12, h: 9 },
            { id: "cupcakes_box_table", prep: "на", place: "на столе", name: "пирожные на столе", x: 34, y: 55, w: 15, h: 15 },
            { id: "bag_on_table", prep: "на", place: "на столе", name: "лук на столе", x: 69, y: 36, w: 8, h: 10 },
            { id: "pot_island", prep: "на", place: "на плите", name: "кастрюля на плите", x: 28, y: 27, w: 6, h: 10 },
            { id: "pan_island", prep: "на", place: "на плите", name: "сковорода на плите", x: 37, y: 31, w: 8, h: 7 },
            { id: "cabbage_island", prep: "на", place: "на столе", name: "капуста на столе", x: 50, y: 30, w: 5, h: 7 },
            { id: "carrots_onions_island", prep: "на", place: "на столе", name: "морковь на столе", x: 45, y: 36, w: 13, h: 8 },
            { id: "jar_tomatoes", prep: "на", place: "на полке", name: "банка на полке", x: 46, y: 5, w: 5, h: 13 },
            { id: "jar_pickles", prep: "на", place: "на полке", name: "банка на полке", x: 51, y: 6, w: 4, h: 12 },
            { id: "jar_berries", prep: "на", place: "на полке", name: "банка на полке", x: 56, y: 6, w: 5, h: 12 },

            { id: "watermelon_fridge", prep: "в", place: "в холодильнике", name: "арбуз в холодильнике", x: 71, y: 12, w: 5, h: 8 },
            { id: "cheese_fridge", prep: "в", place: "в холодильнике", name: "сыр в холодильнике", x: 76, y: 22, w: 5, h: 6 },
            { id: "cola_fridge", prep: "в", place: "в холодильнике", name: "бутылка в холодильнике", x: 65, y: 18, w: 3, h: 12 },
            { id: "small_pot_fridge", prep: "в", place: "в холодильнике", name: "кастрюля в холодильнике", x: 75, y: 29, w: 5, h: 7 },
            { id: "chicken_oven", prep: "в", place: "в духовке", name: "курица в духовке", x: 89, y: 21, w: 10, h: 10 },
            { id: "veggies_sink", prep: "в", place: "в раковине", name: "овощи в раковине", x: 53, y: 44, w: 16, h: 8 },
            { id: "trash_pizza", prep: "в", place: "в ведре", name: "пицца в ведре", x: 77, y: 61, w: 7, h: 9 },

            { id: "cake_under_table", prep: "под", place: "под столом", name: "пирожное под столом", x: 42, y: 88, w: 7, h: 9 },

            { id: "bin_near_island", prep: "возле", place: "возле стола", name: "ведро возле стола", x: 76, y: 70, w: 12, h: 27 },

            { id: "hood_above_stove", prep: "над", place: "над плитой", name: "вытяжка над плитой", x: 33, y: 0, w: 12, h: 6 }
        ];

        const PREPOSITIONS = ["на", "в", "под", "возле", "за", "над"];
        let activePrepFilter = "все";
        let gameMode = 1;
        let score = 0;
        let currentTarget = null;
        let roundQueue = [];

        const speechFixes = [
            [/\bна полке\b/gi, "на по́лке"],
            [/\bв холодильнике\b/gi, "в холоди́льнике"],
            [/\bпод столом\b/gi, "под столо́м"],
            [/\bнад плитой\b/gi, "над плито́й"],
            [/\bвозле стола\b/gi, "во́зле стола́"],
            [/\bпирожное\b/gi, "пиро́жное"],
            [/\bпирожные\b/gi, "пиро́жные"],
            [/\bсэндвичи\b/gi, "сэ́ндвичи"],
            [/\bкастрюля\b/gi, "кастрю́ля"],
            [/\bсковорода\b/gi, "сковорода́"],
            [/\bвытяжка\b/gi, "вы́тяжка"]
        ];

        function clearSpeechText(text) {
            let out = String(text || "");
            speechFixes.forEach(([re, rep]) => {
                out = out.replace(re, rep);
            });
            return out;
        }

        function pickRussianVoice() {
            if (!("speechSynthesis" in window)) return null;
            const voices = window.speechSynthesis.getVoices() || [];
            const ru = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith("ru"));
            if (!ru.length) return null;
            return ru.find(v => /google|microsoft|irina|svetlana|dmitry|russian/i.test(v.name)) || ru[0];
        }

        if ("speechSynthesis" in window && typeof window.speechSynthesis.getVoices === "function") {
            window.speechSynthesis.getVoices();
            window.speechSynthesis.onvoiceschanged = () => pickRussianVoice();
        }

        function updateMenuFilterInfo() {
            const infoEl = document.getElementById("menu-filter-info");
            if (activePrepFilter === "все") {
                infoEl.innerText = `Выбраны все предлоги (зон: ${items.length})`;
                return;
            }
            const count = items.filter(i => i.prep === activePrepFilter).length;
            infoEl.innerText = count > 0
                ? `Предлог «${activePrepFilter}» — зон в выборке: ${count}`
                : `Для предлога «${activePrepFilter}» пока нет отдельных зон — при запуске будут доступны все зоны (${items.length}).`;
        }

        function renderMenuFilters() {
            const box = document.getElementById("menu-prep-filters");
            box.innerHTML = "";
            ["все", ...PREPOSITIONS].forEach(p => {
                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = `prep-pill ${activePrepFilter === p ? "active" : ""}`;
                btn.innerText = p === "все" ? "Все предлоги" : `Предлог «${p}»`;
                btn.addEventListener("click", () => {
                    activePrepFilter = p;
                    renderMenuFilters();
                    updateMenuFilterInfo();
                });
                box.appendChild(btn);
            });
            updateMenuFilterInfo();
        }

        function getFilteredItems() {
            if (activePrepFilter === "все") return items;
            const filtered = items.filter(i => i.prep === activePrepFilter);
            return filtered.length ? filtered : items;
        }

        function goMenu() {
            if ("speechSynthesis" in window) {
                try { window.speechSynthesis.cancel(); } catch (e) {}
            }
            document.getElementById("menu-screen").classList.remove("hidden");
            document.getElementById("game-screen").classList.add("hidden");
        }

        function speak(text) {
            if ("speechSynthesis" in window) {
                try {
                    window.speechSynthesis.cancel();
                    const u = new SpeechSynthesisUtterance(clearSpeechText(text));
                    u.lang = "ru-RU";
                    u.rate = 0.85;
                    u.pitch = 1.0;
                    const voice = pickRussianVoice();
                    if (voice) u.voice = voice;
                    window.speechSynthesis.speak(u);
                } catch (e) {}
            }
        }

        function shuffle(arr) {
            const copy = [...arr];
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

        function startGame(mode) {
            gameMode = mode;
            score = 0;
            document.getElementById("score").innerText = score;
            document.getElementById("menu-screen").classList.add("hidden");
            document.getElementById("game-screen").classList.remove("hidden");
            document.getElementById("game-status").innerText = "";

            const layer = document.getElementById("game-hotspots");
            layer.innerHTML = "";

            const pool = getFilteredItems();

            items.forEach(item => {
                const div = document.createElement("div");
                div.className = "hotspot";
                div.dataset.id = item.id;
                div.style.left = item.x + "%";
                div.style.top = item.y + "%";
                div.style.width = item.w + "%";
                div.style.height = item.h + "%";
                div.addEventListener("click", () => handleGameClick(item, div));
                layer.appendChild(div);
            });

            if (mode === 1) {
                document.getElementById("repeat-task-btn").classList.remove("hidden");
                roundQueue = shuffle(pool);
                nextTask();
            } else {
                document.getElementById("repeat-task-btn").classList.add("hidden");
                document.getElementById("game-task-text").innerText = "Режим 2: Наведите на предмет и нажмите, чтобы услышать фразу";
                speak("Наводите на предметы и нажимайте.");
            }
        }

        function nextTask() {
            if (!roundQueue.length) {
                roundQueue = shuffle(getFilteredItems());
            }
            currentTarget = roundQueue.pop();
            document.getElementById("game-task-text").innerText = `Найди: ${currentTarget.name}`;
            speak(`Найди: ${currentTarget.name}`);
        }

        function speakCurrentTask() {
            if (currentTarget) {
                speak(`Найди: ${currentTarget.name}`);
            }
        }

        function handleGameClick(item, el) {
            if (gameMode === 2) {
                document.getElementById("game-status").innerText = `${item.name} (предлог «${item.prep}»)`;
                speak(item.name);
                return;
            }

            if (!currentTarget) return;

            if (item.id === currentTarget.id) {
                score += 1;
                document.getElementById("score").innerText = score;
                el.classList.add("hotspot-correct");
                document.getElementById("game-status").innerText = `Верно! ${item.name}`;
                speak(`Правильно! ${item.name}`);
                setTimeout(() => {
                    el.classList.remove("hotspot-correct");
                    document.getElementById("game-status").innerText = "";
                    nextTask();
                }, 1100);
            } else {
                el.classList.add("hotspot-wrong");
                document.getElementById("game-status").innerText = `Здесь ${item.name}. Попробуй найти: ${currentTarget.name}`;
                speak("Попробуй ещё раз!");
                setTimeout(() => {
                    el.classList.remove("hotspot-wrong");
                }, 700);
            }
        }

        document.getElementById("btn-mode-1").addEventListener("click", () => startGame(1));
        document.getElementById("btn-mode-2").addEventListener("click", () => startGame(2));
        document.getElementById("btn-back-menu").addEventListener("click", goMenu);
        document.getElementById("repeat-task-btn").addEventListener("click", speakCurrentTask);

        renderMenuFilters();
    </script>
</body>
</html>
