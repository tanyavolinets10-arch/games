<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игра: Изучение одежды — Русский язык</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/canvas-confetti.browser.min.js"></script>
    <style>
        body {
            background-color: #f8fafc;
            background-image: linear-gradient(rgba(255, 255, 255, 0.88), rgba(255, 255, 255, 0.88)), url('https://i.postimg.cc/Vrv82XtF/odezda.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 select-none font-sans text-slate-800">

    <!-- Шапка с прогрессом -->
    <div id="header-container" class="bg-white shadow-md border-2 border-emerald-200 px-6 py-3 rounded-2xl flex justify-between items-center w-full max-w-md hidden">
        <div class="flex items-center gap-2">
            <button onclick="goHome()" class="bg-emerald-100 hover:bg-emerald-200 text-emerald-900 px-3 py-1 rounded-xl text-xs font-bold cursor-pointer">🏠 Меню</button>
            <h1 class="text-sm font-bold text-emerald-800" id="round-title">Раунд</h1>
        </div>
        <div class="font-bold text-slate-700 text-xs">⭐ Баллы: <span id="stars" class="text-emerald-600">0</span> | Осталось: <span id="progress-text">20</span></div>
    </div>

    <!-- Основное игровое поле -->
    <div class="w-full max-w-md flex flex-col gap-4 my-auto">
        
        <!-- ГЛАВНОЕ МЕНЮ (Кнопки сразу активны) -->
        <div id="round-menu" class="bg-white border-4 border-emerald-300 rounded-3xl p-6 shadow-xl flex flex-col items-center gap-5 text-center">
            <div class="text-4xl">🧥👗🧢👟</div>
            <h2 class="text-xl font-black text-emerald-900">Изучаем Одежду</h2>
            <p class="text-xs text-slate-600">Русский язык. Выберите режим игры:</p>
            
            <div class="flex flex-col gap-3 w-full">
                <button onclick="startRound(1)" class="bg-emerald-50 hover:bg-emerald-100 border-2 border-emerald-300 text-emerald-900 font-bold p-4 rounded-2xl shadow-sm cursor-pointer transition flex flex-col items-center gap-1">
                    <span class="text-sm font-black">🖼️ Раунд 1: Видим картинку ➔ Выбираем слово на слух</span>
                    <span class="text-xs text-slate-600 font-normal">Смотрим на предмет одежды и выбираем название на слух</span>
                </button>

                <button onclick="startRound(2)" class="bg-emerald-50 hover:bg-emerald-100 border-2 border-emerald-300 text-emerald-900 font-bold p-4 rounded-2xl shadow-sm cursor-pointer transition flex flex-col items-center gap-1">
                    <span class="text-sm font-black">👂 Раунд 2: Слышим слово ➔ Ищем картинку</span>
                    <span class="text-xs text-slate-600 font-normal">Слушаем русскую озвучку и ищем нужный предмет</span>
                </button>
            </div>
        </div>

        <!-- ИГРОВОЙ ЭКРАН -->
        <div id="game-container" class="bg-white border-4 border-emerald-300 rounded-3xl p-6 shadow-xl flex flex-col items-center gap-5 text-center hidden">
            <div id="task-box" class="w-full bg-emerald-50 border-2 border-emerald-200 rounded-2xl p-5 flex flex-col items-center gap-3">
                <!-- Динамическое задание -->
            </div>
            <div class="w-full" id="options-grid">
                <!-- Варианты ответов -->
            </div>
        </div>

    </div>

    <!-- Экран победы -->
    <div id="win" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl p-8 max-w-sm text-center shadow-2xl border-4 border-emerald-400 flex flex-col items-center gap-4">
            <div class="text-7xl animate-bounce">🏆</div>
            <h2 class="text-2xl font-bold text-emerald-700">Молодец! Отлично!</h2>
            <p class="text-slate-600 text-sm">Ты успешно изучил всю одежду на русском языке!</p>
            <button onclick="goHome()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-6 rounded-xl shadow cursor-pointer text-base w-full">
                В меню 🏠
            </button>
        </div>
    </div>

    <script>
        const clothesItems = [
            { name: "ботинки", img: "https://i.postimg.cc/S2RhHc99/botinki.png" },
            { name: "дождевик", img: "https://i.postimg.cc/PpJj01DZ/dozdevik.png" },
            { name: "кофта", img: "https://i.postimg.cc/S2RhHc9M/kofta.png" },
            { name: "кроссовки", img: "https://i.postimg.cc/PpJj01D1/krosovki.png" },
            { name: "куртка", img: "https://i.postimg.cc/5YyVD8z5/kurtka.png" },
            { name: "майка", img: "https://i.postimg.cc/Kkj2CtTr/majka.png" },
            { name: "носки", img: "https://i.postimg.cc/k6GmLWSQ/noski.png" },
            { name: "очки", img: "https://i.postimg.cc/Vrv82XtR/ocki.png" },
            { name: "пальто", img: "https://i.postimg.cc/47ygjpcP/pal'to.png" },
            { name: "платье", img: "https://i.postimg.cc/MMHSg1Bt/plat'e.png" },
            { name: "резиновые сапоги", img: "https://i.postimg.cc/2byDgnW2/rizinovye-sapogi.png" },
            { name: "свитер", img: "https://i.postimg.cc/47ygjpcW/sviter.png" },
            { name: "тапки", img: "https://i.postimg.cc/hzvBNVmy/tapki.png" },
            { name: "футболка", img: "https://i.postimg.cc/2byDgnWH/futbolka.png" },
            { name: "шапка", img: "https://i.postimg.cc/phSHvyQK/sapka.png" },
            { name: "шарф", img: "https://i.postimg.cc/KkW2b477/sarf.png" },
            { name: "шляпа", img: "https://i.postimg.cc/jw1bTC6h/slapa.png" },
            { name: "шорты", img: "https://i.postimg.cc/34qThWj1/sorty.png" },
            { name: "штаны", img: "https://i.postimg.cc/470gGnv5/stany.png" },
            { name: "юбка", img: "https://i.postimg.cc/bD5hPd0L/ubka.png" }
        ];

        let currentRoundNum = 1;
        let roundQueue = [];
        let currentTarget = null;
        let stars = 0;
        let isBlocked = false;

        function speak(text) {
            if ('speechSynthesis' in window) {
                try {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'ru-RU';
                    utterance.rate = 0.85;
                    window.speechSynthesis.speak(utterance);
                } catch(e) {
                    console.log("Speech error:", e);
                }
            }
        }

        function shuffle(array) {
            return [...array].sort(() => Math.random() - 0.5);
        }

        function goHome() {
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            document.getElementById('header-container').classList.add('hidden');
            document.getElementById('game-container').classList.add('hidden');
            document.getElementById('win').classList.add('hidden');
            document.getElementById('round-menu').classList.remove('hidden');
        }

        function startRound(roundNum) {
            currentRoundNum = roundNum;
            stars = 0;
            document.getElementById('round-menu').classList.add('hidden');
            document.getElementById('header-container').classList.remove('hidden');
            document.getElementById('game-container').classList.remove('hidden');
            
            roundQueue = shuffle([...clothesItems]);
            speak("Давайте начнем");
            loadNextTask();
        }

        function loadNextTask() {
            if (roundQueue.length === 0) {
                document.getElementById('game-container').classList.add('hidden');
                document.getElementById('header-container').classList.add('hidden');
                document.getElementById('win').classList.remove('hidden');
                if (typeof confetti === 'function') confetti({ particleCount: 150, spread: 100, origin: { y: 0.5 } });
                speak("Ура! Ты отлично знаешь всю одежду!");
                return;
            }

            isBlocked = false;
            currentTarget = roundQueue[0];

            document.getElementById('round-title').innerText = `🧥 Раунд ${currentRoundNum}`;
            document.getElementById('progress-text').innerText = roundQueue.length;
            document.getElementById('stars').innerText = stars;

            if (currentRoundNum === 1) {
                renderRound1();
            } else {
                renderRound2();
            }
        }

        // --- РАУНД 1 ---
        function renderRound1() {
            const taskBox = document.getElementById('task-box');
            taskBox.innerHTML = `
                <div class="text-xs font-bold text-emerald-800 uppercase tracking-wide">Посмотри на картинку и выбери название на слух:</div>
                <div class="w-36 h-36 bg-white border-2 border-emerald-200 rounded-2xl flex items-center justify-center p-2 shadow-sm my-1 mx-auto overflow-hidden">
                    <img src="${currentTarget.img}" alt="одежда" class="max-h-full max-w-full object-contain">
                </div>
            `;

            const grid = document.getElementById('options-grid');
            grid.className = "flex flex-col gap-2.5 w-full";
            grid.innerHTML = "";

            let options = [currentTarget];
            let others = clothesItems.filter(item => item.name !== currentTarget.name);
            options = options.concat(shuffle(others).slice(0, 3));
            options = shuffle(options);

            options.forEach((opt, index) => {
                const row = document.createElement('div');
                row.className = "flex items-center justify-between bg-emerald-50/60 border border-emerald-200 rounded-2xl p-3 shadow-xs";
                
                row.innerHTML = `
                    <div class="flex items-center gap-2">
                        <span class="w-6 h-6 rounded-full bg-emerald-200 text-emerald-900 font-bold text-xs flex items-center justify-center">${index + 1}</span>
                        <span class="text-sm font-bold text-slate-700">Вариант ${index + 1}</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="speak('${opt.name}')" class="bg-emerald-100 hover:bg-emerald-200 text-emerald-900 px-3 py-2 rounded-xl text-xs cursor-pointer transition font-bold shadow-xs flex items-center gap-1">
                            🔊 Слушать
                        </button>
                        <button onclick="checkAnswerRound1(${opt.name === currentTarget.name}, this, '${opt.name}')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs px-4 py-2 rounded-xl cursor-pointer transition shadow">
                            Выбрать ✨
                        </button>
                    </div>
                `;
                grid.appendChild(row);
            });
        }

        function checkAnswerRound1(isCorrect, btnElement, optName) {
            if (isBlocked) return;
            isBlocked = true;

            const rowElement = btnElement.closest('div.bg-emerald-50\\/60');

            if (isCorrect) {
                stars += 1;
                document.getElementById('stars').innerText = stars;
                rowElement.className = "flex items-center justify-between bg-emerald-100 border border-emerald-500 rounded-2xl p-3 shadow-xs relative";
                btnElement.className = "bg-emerald-600 text-white font-bold text-xs px-4 py-2 rounded-xl";
                btnElement.innerText = "Верно! ✔️";
                speak(`Правильно! Это ${optName}`);
                if (typeof confetti === 'function') confetti({ particleCount: 25, spread: 30, origin: { y: 0.7 } });
                roundQueue.shift();
            } else {
                rowElement.className = "flex items-center justify-between bg-rose-100 border border-rose-400 rounded-2xl p-3 shadow-xs relative";
                btnElement.className = "bg-rose-500 text-white font-bold text-xs px-4 py-2 rounded-xl";
                btnElement.innerText = "Ошибка ❌";
                speak("Неправильно, попробуй другой вариант");

                const failed = roundQueue.shift();
                roundQueue.push(failed);
            }

            setTimeout(() => {
                loadNextTask();
            }, 1400);
        }

        // --- РАУНД 2 ---
        function renderRound2() {
            const taskBox = document.getElementById('task-box');
            taskBox.innerHTML = `
                <div class="text-xs font-bold text-emerald-800 uppercase tracking-wide">Найди картинку для слова:</div>
                <button onclick="speak('${currentTarget.name}')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-6 py-3 rounded-2xl text-base shadow cursor-pointer transition flex items-center gap-2 mx-auto capitalize">
                    🔊 Послушать слово
                </button>
            `;
            speak(currentTarget.name);

            const grid = document.getElementById('options-grid');
            grid.className = "grid grid-cols-2 gap-3";
            grid.innerHTML = "";

            let options = [currentTarget];
            let others = clothesItems.filter(item => item.name !== currentTarget.name);
            options = options.concat(shuffle(others).slice(0, 3));
            options = shuffle(options);

            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "h-32 bg-emerald-50 hover:bg-emerald-100 border-2 border-emerald-200 rounded-2xl flex flex-col items-center justify-center cursor-pointer transition shadow-sm relative overflow-hidden p-2";
                btn.onclick = () => checkAnswerRound2(btn, opt.name === currentTarget.name);
                btn.innerHTML = `
                    <div class="w-24 h-24 flex items-center justify-center overflow-hidden pointer-events-none">
                        <img src="${opt.img}" alt="одежда" class="max-h-full max-w-full object-contain">
                    </div>
                    <div class="status-overlay absolute inset-0 hidden items-center justify-center text-4xl bg-white/90"></div>
                `;
                grid.appendChild(btn);
            });
        }

        function checkAnswerRound2(btnElement, isCorrect) {
            if (isBlocked) return;
            isBlocked = true;

            let overlay = btnElement.querySelector('.status-overlay');
            if (!overlay) {
                overlay = document.createElement('div');
                overlay.className = "status-overlay absolute inset-0 flex items-center justify-center text-4xl bg-white/90";
                btnElement.appendChild(overlay);
            }
            overlay.classList.remove('hidden');

            if (isCorrect) {
                stars += 1;
                document.getElementById('stars').innerText = stars;
                overlay.innerText = "✅";
                speak("Правильно!");
                if (typeof confetti === 'function') confetti({ particleCount: 25, spread: 30, origin: { y: 0.7 } });
                roundQueue.shift();
            } else {
                overlay.innerText = "❌";
                speak("Попробуй ещё раз!");

                const failed = roundQueue.shift();
                roundQueue.push(failed);
            }

            setTimeout(() => {
                loadNextTask();
            }, 1400);
        }
    </script>
</body>
</html>
