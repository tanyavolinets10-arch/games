<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning English: Seasons</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/canvas-confetti.browser.min.js"></script>
    <style>
        body {
            /* Ваша картинка на фоне с мягким осветлением для читаемости */
            background-image: linear-gradient(rgba(253, 251, 247, 0.78), rgba(253, 251, 247, 0.78)), url('https://i.postimg.cc/8PqxbNJ4/seasons-jpg.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 select-none font-sans text-slate-800">

    <!-- Шапка с прогрессом -->
    <div id="header-container" class="bg-white/90 backdrop-blur px-6 py-3 rounded-2xl shadow-md border-2 border-amber-200 flex justify-between items-center w-full max-w-md hidden">
        <div class="flex items-center gap-2">
            <button onclick="goHome()" class="bg-amber-100 hover:bg-amber-200 text-amber-900 px-3 py-1 rounded-xl text-xs font-bold cursor-pointer">🏠 Menu</button>
            <h1 class="text-sm font-bold text-amber-800" id="round-title">Round 1</h1>
        </div>
        <div class="font-bold text-slate-700 text-xs">⭐ Stars: <span id="stars" class="text-amber-600">0</span> | Left: <span id="progress-text">8</span></div>
    </div>

    <!-- Основное игровое поле -->
    <div class="w-full max-w-md flex flex-col gap-4 my-auto">
        
        <!-- ГЛАВНОЕ МЕНЮ (Выбор раунда) -->
        <div id="round-menu" class="bg-white/95 backdrop-blur border-4 border-amber-300 rounded-3xl p-6 shadow-xl flex flex-col items-center gap-5 text-center">
            <div class="text-3xl">🍂❄️🌷☀️</div>
            <h2 class="text-xl font-black text-amber-900">Learning Seasons</h2>
            <p class="text-xs text-slate-600">Choose a round:</p>
            
            <div class="flex flex-col gap-3 w-full">
                <button onclick="startRound(1)" class="bg-amber-50 hover:bg-amber-100 border-2 border-amber-300 text-amber-900 font-bold py-3.5 px-6 rounded-2xl shadow-sm cursor-pointer text-base transition flex flex-col items-center gap-1">
                    <span class="text-sm font-black">👂 Round 1: Hear word ➔ Choose icon</span>
                    <span class="text-xs text-slate-600 font-normal">8 tasks (single attributes)</span>
                </button>
                <button onclick="startRound(2)" class="bg-amber-50 hover:bg-amber-100 border-2 border-amber-300 text-amber-900 font-bold py-3.5 px-6 rounded-2xl shadow-sm cursor-pointer text-base transition flex flex-col items-center gap-1">
                    <span class="text-sm font-black">🗣️ Round 2: See picture ➔ Hear & choose word</span>
                    <span class="text-xs text-slate-600 font-normal">8 tasks for reinforcement</span>
                </button>
            </div>
        </div>

        <!-- ИГРОВОЙ ЭКРАН -->
        <div id="game-container" class="bg-white/95 backdrop-blur border-4 border-amber-300 rounded-3xl p-6 shadow-xl flex flex-col items-center gap-5 text-center hidden">
            <div id="task-box" class="w-full bg-amber-50 border-2 border-amber-200 rounded-2xl p-5 flex flex-col items-center gap-3">
                <!-- Динамическое задание -->
            </div>
            <div class="w-full" id="options-grid">
                <!-- Варианты ответов -->
            </div>
        </div>

    </div>

    <!-- Экран победы -->
    <div id="win" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-3xl p-8 max-w-sm text-center shadow-2xl border-4 border-amber-400 flex flex-col items-center gap-4">
            <div class="text-7xl animate-bounce">🏆</div>
            <h2 class="text-2xl font-bold text-amber-700">Awesome!</h2>
            <p class="text-slate-600 text-sm">You have successfully completed all tasks about seasons!</p>
            <button onclick="goHome()" class="bg-amber-600 hover:bg-amber-700 text-white font-bold py-3 px-6 rounded-xl shadow cursor-pointer text-base w-full">
                Menu 🏠
            </button>
        </div>
    </div>

    <script>
        const seasonsData = [
            { 
                name: "summer", 
                fullIcon: "🍑☀️🌊👒", 
                singleIcons: ["🍑", "☀️", "🌊", "👒"],
                desc: "Peach, sun, sea, hat" 
            },
            { 
                name: "autumn", 
                fullIcon: "🍂☂️🌧️🎃", 
                singleIcons: ["🍂", "☂️", "🌧️", "🎃"],
                desc: "Leaf, umbrella, rain, pumpkin" 
            },
            { 
                name: "winter", 
                fullIcon: "❄️🧣⛄🛷", 
                singleIcons: ["❄️", "🧣", "⛄", "🛷"],
                desc: "Snow, scarf, snowman, sled" 
            },
            { 
                name: "spring", 
                fullIcon: "🌷🌱🧥", 
                singleIcons: ["🌷", "🌱", "🧥"],
                desc: "Tulip, sprout, jacket" 
            }
        ];

        let currentRoundNum = 1;
        let roundQueue = [];
        let currentTarget = null;
        let stars = 0;
        let isBlocked = false;

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.85;
                window.speechSynthesis.speak(utterance);
            }
        }

        function shuffle(array) {
            return [...array].sort(() => Math.random() - 0.5);
        }

        function goHome() {
            window.speechSynthesis.cancel();
            document.getElementById('header-container').classList.add('hidden');
            document.getElementById('game-container').classList.add('hidden');
            document.getElementById('win').classList.add('hidden');
            document.getElementById('round-menu').classList.remove('hidden');
        }

        function startRound(roundNum) {
            currentRoundNum = roundNum;
            stars = 0;
            document.getElementById('round-menu').classList.add('hidden');
            document.getElementById('header-container').classList.remove('hidden');
            document.getElementById('game-container').classList.remove('hidden');
            
            roundQueue = shuffle([...seasonsData, ...seasonsData]);
            
            // Озвучиваем общую фразу ТОЛЬКО один раз при старте раунда
            speak("Listen and choose");

            loadNextTask();
        }

        function loadNextTask() {
            if (roundQueue.length === 0) {
                document.getElementById('game-container').classList.add('hidden');
                document.getElementById('header-container').classList.add('hidden');
                document.getElementById('win').classList.remove('hidden');
                if (typeof confetti === 'function') confetti({ particleCount: 150, spread: 100, origin: { y: 0.5 } });
                speak("Hooray! You did a great job!");
                return;
            }

            isBlocked = false;
            currentTarget = roundQueue[0];

            document.getElementById('round-title').innerText = `🌿 Seasons • Round ${currentRoundNum}`;
            document.getElementById('progress-text').innerText = roundQueue.length;
            document.getElementById('stars').innerText = stars;

            if (currentRoundNum === 1) {
                renderRound1();
            } else {
                renderRound2();
            }
        }

        // --- РАУНД 1: Слышим слово ➔ Выбираем значок (ПО ОДНОМУ ПРИЗНАКУ НА КАРТОЧКУ) ---
        function renderRound1() {
            const taskBox = document.getElementById('task-box');
            taskBox.innerHTML = `
                <div class="text-xs font-bold text-amber-800 uppercase tracking-wide">Find the icon for the word:</div>
                <button onclick="speak(currentTarget.name)" class="bg-amber-600 hover:bg-amber-700 text-white font-bold px-6 py-3 rounded-2xl text-base shadow cursor-pointer transition flex items-center gap-2">
                    🔊 Listen to word
                </button>
            `;
            speak(currentTarget.name);

            const grid = document.getElementById('options-grid');
            grid.className = "grid grid-cols-2 gap-3";
            grid.innerHTML = "";

            let options = [currentTarget];
            let others = seasonsData.filter(item => item.name !== currentTarget.name);
            options = options.concat(shuffle(others).slice(0, 3));
            options = shuffle(options);

            options.forEach(opt => {
                const randomSingleIcon = opt.singleIcons[Math.floor(Math.random() * opt.singleIcons.length)];

                const btn = document.createElement('button');
                btn.className = "h-28 bg-amber-50 hover:bg-amber-100 border-2 border-amber-200 rounded-2xl flex items-center justify-center cursor-pointer transition shadow-sm relative overflow-hidden";
                btn.dataset.season = opt.name;
                btn.innerHTML = `
                    <span class="text-5xl">${randomSingleIcon}</span>
                    <div class="status-overlay absolute inset-0 hidden items-center justify-center text-4xl bg-black/10"></div>
                `;
                btn.onclick = () => checkAnswerRound1(btn, opt.name === currentTarget.name);
                grid.appendChild(btn);
            });
        }

        function checkAnswerRound1(btnElement, isCorrect) {
            if (isBlocked) return;
            isBlocked = true;

            const overlay = btnElement.querySelector('.status-overlay');
            overlay.classList.remove('hidden');

            if (isCorrect) {
                stars += 1;
                document.getElementById('stars').innerText = stars;
                overlay.innerText = "✅";
                speak("Correct!");
                if (typeof confetti === 'function') confetti({ particleCount: 25, spread: 30, origin: { y: 0.7 } });
                roundQueue.shift();
            } else {
                overlay.innerText = "❌";
                speak("Try again!");

                document.querySelectorAll('#options-grid button').forEach(b => {
                    if (b.dataset.season === currentTarget.name) {
                        b.querySelector('.status-overlay').innerText = "✅";
                        b.querySelector('.status-overlay').classList.remove('hidden');
                    }
                });

                const failed = roundQueue.shift();
                roundQueue.push(failed);
            }

            setTimeout(() => {
                loadNextTask();
            }, 1400);
        }

        // --- РАУНД 2: Видим полную картинку-ассоциацию ➔ Выбираем звук на слух ---
        function renderRound2() {
            const taskBox = document.getElementById('task-box');
            taskBox.innerHTML = `
                <div class="text-xs font-bold text-amber-800 uppercase tracking-wide">Look at the picture and choose the heard word:</div>
                <div class="text-5xl my-2">${currentTarget.fullIcon}</div>
            `;

            const grid = document.getElementById('options-grid');
            grid.className = "flex flex-col gap-2.5 w-full";
            grid.innerHTML = "";

            let options = [currentTarget];
            let others = seasonsData.filter(item => item.name !== currentTarget.name);
            options = options.concat(shuffle(others).slice(0, 3));
            options = shuffle(options);

            options.forEach((opt, index) => {
                const row = document.createElement('div');
                row.className = "flex items-center justify-between bg-amber-50/60 border border-amber-200 rounded-2xl p-3 shadow-xs";
                
                row.innerHTML = `
                    <div class="flex items-center gap-2">
                        <span class="w-7 h-7 rounded-full bg-amber-200 text-amber-900 font-bold text-xs flex items-center justify-center">${index + 1}</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="speak('${opt.name}')" class="bg-amber-100 hover:bg-amber-200 text-amber-900 px-4 py-2 rounded-xl text-xs cursor-pointer transition font-bold shadow-xs flex items-center gap-1">
                            🔊 Listen
                        </button>
                        <button onclick="checkAnswerRound2(${opt.name === currentTarget.name}, this, '${opt.name}')" class="bg-amber-600 hover:bg-amber-700 text-white font-bold text-xs px-5 py-2 rounded-xl cursor-pointer transition shadow">
                            Select ✨
                        </button>
                    </div>
                `;
                grid.appendChild(row);
            });
        }

        function checkAnswerRound2(isCorrect, btnElement, optName) {
            if (isBlocked) return;
            isBlocked = true;

            const rowElement = btnElement.closest('div.bg-amber-50\\/60');

            if (isCorrect) {
                stars += 1;
                document.getElementById('stars').innerText = stars;
                rowElement.className = "flex items-center justify-between bg-emerald-100 border border-emerald-500 rounded-2xl p-3 shadow-xs relative";
                btnElement.className = "bg-emerald-600 text-white font-bold text-xs px-5 py-2 rounded-xl";
                btnElement.innerText = "Correct! ✔️";
                speak(`Correct! It is ${optName}`);
                if (typeof confetti === 'function') confetti({ particleCount: 25, spread: 30, origin: { y: 0.7 } });
                roundQueue.shift();
            } else {
                rowElement.className = "flex items-center justify-between bg-rose-100 border border-rose-400 rounded-2xl p-3 shadow-xs relative";
                btnElement.className = "bg-rose-500 text-white font-bold text-xs px-5 py-2 rounded-xl";
                btnElement.innerText = "Error ❌";
                speak("Incorrect, try another option");

                const failed = roundQueue.shift();
                roundQueue.push(failed);
            }

            setTimeout(() => {
                loadNextTask();
            }, 1400);
        }
    </script>
</body>
</html>
