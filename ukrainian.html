<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Українські ігри | LOGO RED LIPS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            background: linear-gradient(135deg, #fffcf7 0%, #fef3c7 40%, #fae8ff 100%);
            background-attachment: fixed;
        }
        img { -webkit-user-drag: none; user-drag: none; }
        .cozy-card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col text-amber-950" oncontextmenu="return false;">

    <!-- Шапка с переключателем языков -->
    <header class="py-4 px-6 backdrop-blur-md bg-white/70 border-b border-amber-100/60 sticky top-0 z-50 shadow-sm">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <a href="index.html" class="bg-amber-100/80 hover:bg-amber-200/80 text-amber-900 font-bold px-4 py-2 rounded-2xl transition text-sm flex items-center gap-1.5 shadow-sm">
                ← На головну
            </a>
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-3">
                    <img src="logo.jpg" alt="Logo Red Lips" class="w-10 h-10 rounded-full object-cover border-2 border-rose-300 shadow-sm">
                    <span class="font-black text-amber-950 text-sm hidden sm:inline">LOGO RED LIPS</span>
                </div>
                <!-- Переключатель языков -->
                <div class="flex gap-1.5 bg-amber-100/60 p-1 rounded-2xl border border-amber-200/60 text-xs font-bold">
                    <a href="russian.html" class="px-3 py-1.5 rounded-xl hover:bg-amber-200/60 text-amber-900 transition">Русский</a>
                    <a href="ukrainian.html" class="px-3 py-1.5 rounded-xl bg-amber-500 text-white shadow-sm">Українська</a>
                    <a href="english.html" class="px-3 py-1.5 rounded-xl hover:bg-amber-200/60 text-amber-900 transition">English</a>
                </div>
            </div>
        </div>
    </header>

    <!-- Основной контент -->
    <main class="flex-grow max-w-5xl mx-auto px-6 py-16 w-full text-center flex flex-col items-center justify-center">
        <div class="cozy-card max-w-lg rounded-3xl p-10 border border-amber-200/60 shadow-xl shadow-amber-900/5">
            <span class="text-4xl mb-4 block">🇺🇦</span>
            <h2 class="text-2xl font-black text-amber-950 mb-3">Україномовні матеріали</h2>
            <p class="text-amber-800/80 text-sm font-medium mb-6">
                Цей розділ наразі наповнюється. Незабаром тут з'являться нові інтерактивні ігри та розвиваючі завдання українською мовою!
            </p>
            <a href="index.html" class="inline-block bg-amber-500 hover:bg-amber-600 text-white font-bold py-3 px-6 rounded-xl transition shadow-md shadow-amber-500/20 text-sm">
                Повернутися на головну
            </a>
        </div>
    </main>

    <!-- Футер -->
    <footer class="py-6 text-center text-xs text-amber-800/70 backdrop-blur-md bg-white/40 border-t border-amber-200/40">
        <p class="font-semibold">© Авторські матеріали LOGO RED LIPS (@logoredlips)</p>
    </footer>

    <script>
        document.addEventListener('keydown', function (e) {
            if (e.keyCode === 123 || (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74)) || (e.ctrlKey && (e.keyCode === 85 || e.keyCode === 83))) {
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
